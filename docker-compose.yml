version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Use named volume
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  chroma:
    image: chromadb/chroma:latest
    container_name: jarvis-chroma
    restart: unless-stopped
    environment:
      CHROMA_DB_IMPL: duckdb
      CHROMA_PERSIST_DIRECTORY: /data
    volumes:
      - ./data/chroma:/data
    ports:
      - "8000:8000"

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: jarvis-ollama
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_MODELS_PATH: /models
  #   volumes:
  #     - ./data/ollama:/models
  #   ports:
  #     - "11434:11434"

  mcp-proxy:
    image: sparfenyuk/mcp-proxy:latest
    container_name: jarvis-mcp-proxy
    restart: unless-stopped
    command: [
      "--port", "8180", 
      "--host", "0.0.0.0",
      "--named-server", "weather", "python -m api.weather_mcp",
      "--allow-origin", "*",
      "--debug"
    ]
    ports:
      - "8180:8180"
    depends_on:
      - postgres



  weather-mcp:
    build:
      context: .
      dockerfile: docker/weather-mcp.Dockerfile
    container_name: jarvis-weather-mcp
    restart: unless-stopped
    environment:
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-""}
    depends_on:
      - mcp-proxy

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: jarvis-agent
    restart: unless-stopped
    # environment:
      # Add agent-specific env vars here
    depends_on:
      - postgres
      - chroma

  prometheus:
    image: prom/prometheus:latest
    container_name: jarvis-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus  # Use named volume instead
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: jarvis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_SERVER_HTTP_PORT: 3001
    volumes:
      - grafana_data:/var/lib/grafana  # Use named volume
    ports:
      - "3001:3001"

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local