global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'agent'
    static_configs:
      - targets: ['agent:8001']

  - job_name: 'mcp-proxy'
    static_configs:
      - targets: ['mcp-proxy:8180']

  - job_name: 'chroma'
    static_configs:
      - targets: ['chroma:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']  # If using postgres_exporter

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
