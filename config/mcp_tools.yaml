# config/mcp_tools.yaml - CORRECTED & COMPLETE

mcp_proxy:
  server:
    name: "Jarvis MCP Proxy"
    version: "1.0.0"
    host: "mcp-proxy"
    port: 9190
    base_url: "http://mcp-proxy:9190"
    
  clients:
    weather:
      name: "Jarvis Weather Server"
      transport: "sse"
      url: "http://mcp-proxy:9190/servers/weather"
      enabled: false
      session_required: true  # ADDED: indicates session management needed
      capabilities:
        - name: "get_weather"
          description: "Get current weather conditions for a location"
          parameters:
            type: "object"
            properties:
              location:
                type: "string"
                description: "Location name (city, country)"
                default: "Brussels"
            required: []
        
        # FIXED: Added missing forecast capability
        - name: "get_forecast"
          description: "Get weather forecast for multiple days"
          parameters:
            type: "object"
            properties:
              location:
                type: "string"
                description: "Location name"
                default: "Brussels"
              days:
                type: "integer"
                description: "Number of forecast days (1-7)"
                default: 3
                minimum: 1
                maximum: 7
            required: []

    general:
      name: "General System Tools"
      transport: "sse"
      url: "http://mcp-proxy:9190/servers/general"
      enabled: true
      session_required: true  # ADDED: indicates session management needed
      capabilities:
        - name: "get_system_info"
          description: "Get system information and status"
          parameters:
            type: "object"
            properties: {}
            required: []
          
        - name: "execute_command"
          description: "Execute safe shell commands"
          parameters:
            type: "object"
            properties:
              command:
                type: "string"
                description: "Shell command to execute (whitelist: ls, pwd, date, whoami, uptime, df, free, ps)"
            required: ["command"]


        
        # FIXED: Added missing create_file capability
        - name: "create_file"
          description: "Create a text file with specified content"
          parameters:
            type: "object"
            properties:
              filename:
                type: "string"
                description: "Name of file to create"
              content:
                type: "string"
                description: "Content to write to file"
            required: ["filename", "content"]

    # Future capabilities (disabled for now)
    filesystem:
      name: "Filesystem Operations"
      transport: "sse"
      url: "http://filesystem-mcp:8183/sse/"
      enabled: false
      capabilities:
        - name: "read_file"
          description: "Read file contents"
          parameters:
            type: "object"
            properties:
              path:
                type: "string"
                description: "File path relative to workspace"
            required: ["path"]

    fetch:
      name: "HTTP Fetch"
      transport: "sse"
      url: "http://fetch-mcp:8184/sse/"
      enabled: false
      capabilities:
        - name: "fetch_url"
          description: "Fetch content from URL"
          parameters:
            type: "object"
            properties:
              url:
                type: "string"
                format: "uri"
                description: "URL to fetch"
            required: ["url"]

# Agent tool assignments
agent_tools:
  weather:
    class_name: "ReliableWeatherAgent"
    specialization: "Weather information and environmental data specialist"
    # mcp_clients: ["weather"]
    mcp_clients: []  # NO MCP CLIENTS - Direct API only
    api_integration:
      openweather_api: true
      direct_calls: true
      mcp_bypass: true
    a2a_capabilities:
      - name: "weather_query"
        description: "Get weather information for locations"
        input_schema:
          location: "string"
      - name: "current_conditions"
        description: "Get current weather conditions"
        input_schema:
          location: "string"
      # ENHANCED: Added forecast capability
      - name: "weather_forecast"
        description: "Get weather forecast for multiple days"
        input_schema:
          location: "string"
          days: "integer"
    session_memory: true
    behavior_learning: true
    
  routine:
    class_name: "ReliableRoutineAgent"
    specialization: "Routine planning and habit management"
    mcp_clients: ["general"]
    a2a_capabilities:
      - name: "routine_creation"
        description: "Create and manage user routines"
        input_schema:
          routine_type: "string"
          activities: "array"
      - name: "habit_tracking"
        description: "Track routine execution and habits"
        input_schema:
          routine_id: "string"
          completion_status: "boolean"
    session_memory: true
    behavior_learning: true
    
  orchestrator:
    # FIXED: Correct spelling
    class_name: "OrchestratorAgent"
    specialization: "Multi-agent coordination and task delegation"
    mcp_clients: ["general"]
    a2a_capabilities:
      - name: "agent_coordination"
        description: "Coordinate multiple agents for complex tasks"
        input_schema:
          task_description: "string"
          required_agents: "array"
      - name: "task_delegation"
        description: "Delegate tasks to specialized agents"
        input_schema:
          task: "string"
          target_agent: "string"
      - name: "system_monitoring"
        description: "Monitor system status and health"
        input_schema:
          check_type: "string"
    session_memory: true
    context_sharing: true
    behavior_learning: true

# Integration with your existing ChromaDB behavior learning system
behavior_integration:
  enabled: true
  chroma_collection: "jarvis_behavior_memory"
  chroma_url: "http://chroma:8000"
  semantic_analysis: true
  llm_analysis: true
  pattern_learning: true
  dynamic_categorization: true
  session_persistence: true

# Proxy configuration
proxy_config:
  log_level: "info"
  http_enabled: true
  health_check:
    enabled: true
    interval: 30
    endpoint: "/status"
  discovery:
    enabled: true
    endpoint: "/.well-known/mcp.json"

# ADDED: Proxy-specific configuration
proxy_transport_config:
  weather:
    type: "stdio_via_sse"  # stdio server accessed via SSE
    sse_endpoint: "/servers/weather/sse"
    messages_endpoint: "/servers/weather/messages"
    session_management: "auto"  # auto-manage sessions
    
  general:
    type: "stdio_via_sse"  # stdio server accessed via SSE  
    sse_endpoint: "/servers/general/sse"
    messages_endpoint: "/servers/general/messages"
    session_management: "auto"  # auto-manage sessions

# Docker integration
docker_integration:
  network: "jarvis-network"
  containers:
    mcp_proxy: "jarvis-mcp-proxy"
    # weather_mcp: "jarvis-weather-mcp"
    general_mcp: "jarvis-general-mcp"
    chroma: "jarvis-chroma"
    postgres: "jarvis-postgres"
