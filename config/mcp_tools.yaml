# config/mcp_tools.yaml - CORRECTED for your existing setup
# Integrates with your working tbxark/mcp-proxy + weather-mcp + Docker setup

mcp_proxy:
  server:
    name: "Jarvis MCP Proxy"
    version: "1.0.0"
    host: "mcp-proxy"
    port: 9190
    base_url: "http://mcp-proxy:9190"
    
  # Your existing working MCP clients (matches mcp-config.json)
  clients:
    weather:
      name: "Jarvis Weather Server"
      transport: "sse"  # Matches your working setup
      url: "http://weather-mcp:8182/sse/"  # Your existing container
      enabled: true  # Enable since this is working
      capabilities:
        - name: "get_weather"
          description: "Get current weather conditions for a location"
          parameters:
            type: "object"
            properties:
              location:
                type: "string"
                description: "Location name (city, country)"
                default: "Brussels"
            required: ["location"]
          
        - name: "get_forecast"
          description: "Get weather forecast for multiple days"
          parameters:
            type: "object"
            properties:
              location:
                type: "string"
                description: "Location name"
                default: "Brussels"
              days:
                type: "integer"
                minimum: 1
                maximum: 7
                default: 3
            required: ["location"]

    # Add these when you create them later
    filesystem:
      name: "Filesystem Operations"
      transport: "sse"
      url: "http://filesystem-mcp:8183/sse/"  # Future container
      enabled: false  # Disable until implemented
      capabilities:
        - name: "read_file"
          description: "Read file contents"
          parameters:
            type: "object"
            properties:
              path:
                type: "string"
                description: "File path relative to workspace"
            required: ["path"]

    fetch:
      name: "HTTP Fetch"
      transport: "sse"
      url: "http://fetch-mcp:8184/sse/"  # Future container
      enabled: false  # Disable until implemented
      capabilities:
        - name: "fetch_url"
          description: "Fetch content from URL"
          parameters:
            type: "object"
            properties:
              url:
                type: "string"
                format: "uri"
                description: "URL to fetch"
            required: ["url"]

# Agent tool assignments (compatible with your existing ReliableWeatherAgent)
agent_tools:
  weather:
    class_name: "ReliableWeatherAgent"
    specialization: "Weather information and environmental data specialist"
    mcp_clients: ["weather"]  # Only use working weather client
    a2a_capabilities:
      - name: "weather_query"
        description: "Get weather information for locations"
        input_schema:
          location: "string"
          forecast_days: "integer"
      - name: "current_conditions"
        description: "Get current weather conditions"
        input_schema:
          location: "string"
    session_memory: true
    behavior_learning: true
    
  routine:
    class_name: "ReliableRoutineAgent"
    specialization: "Routine planning and habit management"
    mcp_clients: []  # No MCP clients until filesystem is implemented
    a2a_capabilities:
      - name: "routine_creation"
        description: "Create and manage user routines"
        input_schema:
          routine_type: "string"
          activities: "array"
      - name: "habit_tracking"
        description: "Track routine execution and habits"
        input_schema:
          routine_id: "string"
          completion_status: "boolean"
    session_memory: true
    behavior_learning: true
    
  orchestrator:
    class_name: "OrchestatorAgent"
    specialization: "Multi-agent coordination and task delegation"
    mcp_clients: []  # No MCP clients until other services are implemented
    a2a_capabilities:
      - name: "agent_coordination"
        description: "Coordinate multiple agents for complex tasks"
        input_schema:
          task_description: "string"
          required_agents: "array"
      - name: "task_delegation"
        description: "Delegate tasks to specialized agents"
        input_schema:
          task: "string"
          target_agent: "string"
    session_memory: true
    context_sharing: true
    behavior_learning: true

# Integration with your existing ChromaDB behavior learning system
behavior_integration:
  enabled: true
  chroma_collection: "jarvis_behavior_memory"  # Matches your collection name
  chroma_url: "http://chroma:8000"  # Your existing ChromaDB container
  semantic_analysis: true
  llm_analysis: true
  pattern_learning: true
  dynamic_categorization: true
  session_persistence: true

# Proxy configuration compatible with tbxark/mcp-proxy
proxy_config:
  log_level: "info"
  sse_enabled: true  # Your transport method
  http_enabled: true
  health_check:
    enabled: true
    interval: 30
    endpoint: "/health"
  discovery:
    enabled: true
    endpoint: "/.well-known/mcp.json"

# Docker integration (matches your docker-compose.yml)
docker_integration:
  network: "jarvis-network"
  containers:
    mcp_proxy: "jarvis-mcp-proxy"
    weather_mcp: "jarvis-weather-mcp" 
    chroma: "jarvis-chroma"
    postgres: "jarvis-postgres"
